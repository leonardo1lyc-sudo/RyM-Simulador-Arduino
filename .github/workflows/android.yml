# Genera la app Android (Trusted Web Activity) de Banco Uno: un AAB para Google Play y un APK para probar.
# Los archivos quedan en la ejecución, sección "Artifacts".
# Para firmarlos con tu llave de subida, cargá en Settings → Secrets and variables → Actions:
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Sin esos secretos se genera igual, pero sin firmar (sirve para comprobar que compila).
name: App Android
on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Preparar la llave de firma
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/subida.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/subida.jks" >> "$GITHUB_ENV"
            echo "Se firmará con la llave de subida."
          else
            echo "::warning::Sin el secreto ANDROID_KEYSTORE_BASE64 el AAB sale sin firmar y Google Play no lo acepta."
          fi
      - name: Compilar AAB y APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon bundleRelease assembleRelease
      - name: Huella de la firma (para assetlinks.json)
        if: env.ANDROID_KEYSTORE_FILE != ''
        run: keytool -printcert -jarfile app/build/outputs/apk/release/app-release.apk | grep SHA256 || true
      - uses: actions/upload-artifact@v4
        with:
          name: banco-uno-android-${{ github.run_number }}
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
